name: Publicar carrusel (lunes y miércoles)

on:
  schedule:
    # GitHub no lanza el cron a la hora pedida: lo atrasa segun su carga, y a
    # veces horas. Con una sola hora objetivo eso significaba no publicar
    # (paso el 31 de agosto y el 2 de septiembre). Por eso se dispara varias
    # veces y el script acepta una ventana ancha; el candado contra publicar
    # dos veces es la fecha, no la hora.
    - cron: '0 15 * * 1,3'
    - cron: '0 16 * * 1,3'
    - cron: '0 17 * * 1,3'
    - cron: '0 18 * * 1,3'
    - cron: '0 19 * * 1,3'
    - cron: '0 20 * * 1,3'
  workflow_dispatch:
    inputs:
      set:
        description: 'Número de set a publicar (vacío = el siguiente pendiente)'
        required: false
        default: ''
      dry_run:
        description: 'Solo simular, sin llamar a la API'
        type: boolean
        default: false
      verificar:
        description: 'Solo comprobar token, cuenta y cuota. No publica nada.'
        type: boolean
        default: false

concurrency:
  group: publicar-instagram
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # El script decide cual de las dos ejecuciones del dia publica mirando la
      # hora real en Santiago. Sin zona horaria no publica ninguna, asi que la
      # aseguramos aunque el runner ya suela traerla.
      - name: Asegurar la zona horaria de Chile
        run: python -m pip install --quiet tzdata

      - name: Publicar
        id: publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_BASE_URL: ${{ secrets.IG_BASE_URL }}
        run: |
          set -o pipefail   # si publicar.py falla, el paso debe fallar pese al tee
          ARGS=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ARGS="$ARGS --respetar-hora"
          fi
          if [ -n "${{ github.event.inputs.set }}" ]; then
            ARGS="$ARGS --set ${{ github.event.inputs.set }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.verificar }}" = "true" ]; then
            ARGS="--verificar"
          fi
          python publicar.py $ARGS 2>&1 | tee salida_publicacion.txt

      # TikTok va despues de Instagram y a proposito NO corta la ejecucion si
      # falla: el carrusel de Instagram ya salio y no queremos perder ese
      # registro por un problema del otro canal.
      # Solo si Instagram publico de verdad. Antes bastaba con que el paso
      # terminara bien, y como saltarse la publicacion tambien termina bien,
      # TikTok salia solo los dias en que Instagram no salia.
      - name: Enviar el carrusel al buzon de TikTok
        if: >-
          steps.publicar.outputs.publico == 'true'
          || github.event.inputs.verificar == 'true'
          || github.event.inputs.dry_run == 'true'
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_BASE_URL: ${{ secrets.TIKTOK_BASE_URL }}
        run: |
          if [ -z "$TIKTOK_CLIENT_KEY" ]; then
            echo "TikTok sin configurar todavia: me lo salto."
            exit 0
          fi
          # Si la ejecucion era solo para comprobar accesos, aqui tambien se
          # comprueba y no se envia nada. Sin esto, un 'verificar' terminaba
          # mandando un carrusel de verdad al buzon.
          if [ "${{ github.event.inputs.verificar }}" = "true" ]; then
            python publicar_tiktok.py --verificar
            exit 0
          fi
          ARGS=""
          if [ -n "${{ github.event.inputs.set }}" ]; then
            ARGS="--set ${{ github.event.inputs.set }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python publicar_tiktok.py $ARGS

      - name: Dejar dicho que hizo esta ejecucion
        if: always()
        run: |
          if [ "${{ steps.publicar.outputs.publico }}" = "true" ]; then
            echo "Instagram: publicado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Instagram: esta ejecucion no publico. El motivo esta en el"                  "registro del paso *Publicar*." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar estado.json actualizado
        if: always()
        run: |
          if git diff --quiet -- estado.json estado_tiktok.json; then
            echo "Sin cambios de estado."
            exit 0
          fi
          git config user.name  "La Fiore bot"
          git config user.email "actions@github.com"
          git add estado.json estado_tiktok.json
          git commit -m "estado: registro de publicación automática"
          git push

      - name: Abrir issue si falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let detalle = '(sin salida)';
            try { detalle = fs.readFileSync('salida_publicacion.txt', 'utf8').slice(-4000); } catch (e) {}
            const hoy = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `No se pudo publicar el carrusel del ${hoy}`,
              labels: ['publicación'],
              body: [
                'La ejecución automática falló y el set quedó sin publicar.',
                '',
                `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Causas habituales:',
                '- El token de 60 días caducó (renuévalo, ver README).',
                '- `IG_BASE_URL` no apunta a imágenes públicas.',
                '- Se alcanzó el límite de 25 publicaciones en 24 h.',
                '',
                '<details><summary>Salida</summary>',
                '',
                '```',
                detalle,
                '```',
                '',
                '</details>',
              ].join('\n'),
            });
